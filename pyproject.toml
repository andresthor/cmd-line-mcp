[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmd-line-mcp"
version = "0.6.1"
description = "Command-line MCP server for safe command execution"
readme = "README.md"
authors = [{ name = "Andres Saemundsson", email = "andresthor@gmail.com" }]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
]
keywords = ["mcp", "claude", "command-line", "shell", "security"]
requires-python = ">=3.10"
dependencies = ["mcp>=1.6.0,<2"]

[project.urls]
Homepage = "https://github.com/andresthor/cmd-line-mcp"
Repository = "https://github.com/andresthor/cmd-line-mcp"
Issues = "https://github.com/andresthor/cmd-line-mcp/issues"
Changelog = "https://github.com/andresthor/cmd-line-mcp/blob/main/CHANGELOG.md"
Security = "https://github.com/andresthor/cmd-line-mcp/blob/main/docs/SECURITY.md"

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.18.0",
  "flake8>=4.0.0",
  "black>=22.0.0",
]

[project.scripts]
cmd-line-mcp = "cmd_line_mcp.server:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["cmd_line_mcp"]
include-package-data = true

[tool.setuptools.package-data]
cmd_line_mcp = ["default_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
